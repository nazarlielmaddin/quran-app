name: iOS

# Azanify iOS pipeline.
# No Mac on the developer machine: the macOS runner is the build machine,
# the simulator screenshot artifact is the visual check.

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "iosApp/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build + visual check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode' || true
          XC="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${XC:-}" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/shared/build.gradle.kts') }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Kotlin/Native framework
        working-directory: ios
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            TARGET=iosSimulatorArm64
            TASK=linkDebugFrameworkIosSimulatorArm64
          else
            TARGET=iosX64
            TASK=linkDebugFrameworkIosX64
          fi
          echo "KMP_TARGET=$TARGET" >> "$GITHUB_ENV"
          gradle ":shared:$TASK" --no-daemon --stacktrace

      - name: Stage framework for Xcode
        run: |
          set -euo pipefail
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/Shared.framework
          cp -R "ios/shared/build/bin/$KMP_TARGET/debugFramework/Shared.framework" iosApp/Frameworks/
          ls -la iosApp/Frameworks/Shared.framework

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd iosApp
          xcodegen generate --spec project.yml
          xcodebuild -list -project Azanify.xcodeproj

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          LINE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' || true)"
          echo "device line: $LINE"
          UDID="$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)"
          if [ -z "$UDID" ]; then
            RUNTIME="$(xcrun simctl list runtimes | grep -E '^iOS ' | head -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[^ ]+' || true)"
            TYPE="$(xcrun simctl list devicetypes | grep -m1 -E 'iPhone' | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[^ ]+' || true)"
            UDID="$(xcrun simctl create 'Azanify CI' "$TYPE" "$RUNTIME")"
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/Azanify.xcodeproj \
            -scheme Azanify \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch and screenshot
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE=com.quransanctuary.app
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "iosApp/build/Build/Products/Debug-iphonesimulator/Azanify.app"
          mkdir -p artifacts
          for TAB in home reciters quran atmosphere settings; do
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "-tab-$TAB"
            sleep 8
            xcrun simctl io "$UDID" screenshot "artifacts/ios-$TAB.png"
          done
          ls -la artifacts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: artifacts/
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # TestFlight upload — only runs when Apple Developer secrets are set.
  # Required secrets (Settings -> Secrets and variables -> Actions):
  #   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY (base64 .p8)
  #   APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD, PROVISIONING_PROFILE_BASE64
  # -------------------------------------------------------------------
  testflight:
    name: TestFlight upload (optional)
    runs-on: macos-15
    needs: simulator
    if: github.ref == 'refs/heads/main' && secrets.ASC_KEY_ID != ''
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${XC:-}" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Kotlin/Native framework (device)
        working-directory: ios
        run: |
          set -euo pipefail
          gradle ":shared:linkReleaseFrameworkIosArm64" --no-daemon --stacktrace

      - name: Stage framework
        run: |
          set -euo pipefail
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/Shared.framework
          cp -R "ios/shared/build/bin/iosArm64/releaseFramework/Shared.framework" iosApp/Frameworks/

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/azanify.mobileprovision

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd iosApp
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" xcodegen generate --spec project.yml

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/Azanify.xcodeproj \
            -scheme Azanify \
            -configuration Release \
            -sdk iphoneos \
            -archivePath iosApp/build/Azanify.xcarchive \
            -destination "generic/platform=iOS" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath iosApp/build/Azanify.xcarchive \
            -exportPath iosApp/build/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file iosApp/build/export/Azanify.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

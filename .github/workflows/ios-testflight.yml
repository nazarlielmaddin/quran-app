name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testflight:
    name: Archive + upload to TestFlight
    runs-on: macos-15
    if: secrets.ASC_KEY_ID != ''
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${XC:-}" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build Kotlin/Native framework (device)
        working-directory: ios
        run: |
          set -euo pipefail
          gradle ":shared:linkReleaseFrameworkIosArm64" --no-daemon --stacktrace

      - name: Stage framework
        run: |
          set -euo pipefail
          mkdir -p iosApp/Frameworks
          rm -rf iosApp/Frameworks/Shared.framework
          cp -R "ios/shared/build/bin/iosArm64/releaseFramework/Shared.framework" iosApp/Frameworks/

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/azanify.mobileprovision

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          cd iosApp
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" xcodegen generate --spec project.yml

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/Azanify.xcodeproj \
            -scheme Azanify \
            -configuration Release \
            -sdk iphoneos \
            -archivePath iosApp/build/Azanify.xcarchive \
            -destination "generic/platform=iOS" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath iosApp/build/Azanify.xcarchive \
            -exportPath iosApp/build/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios \
            --file iosApp/build/export/Azanify.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
